task_id: logic_easy_03
category: logical_deduction
difficulty: easy
description: Transitive height ordering over 3 people
prompt_template: |-
  Consider these statements about 3 people.

  Farah is taller than Elio.
  Elio is taller than Leo.

  Assume only these statements are true. Who is the tallest?

  Keep any reasoning brief. End your response with a final line of the form 'Answer: <answer>'.
evaluation_type: regex
expected_answer: Farah
answer_pattern: (?is)answer:\W*Farah\W*\Z
