task_id: logic_expert_03
category: logical_deduction
difficulty: expert
description: Count provably-shorter people in a partial order of 12
prompt_template: |-
  Consider these statements about 12 people.

  Jun is taller than Chen.
  Gus is taller than Dara.
  Dara is shorter than Ivo.
  Alice is shorter than Bruno.
  Kara is older than Jun.
  Alice is older than Leo.
  Dara is taller than Kara.
  Dara is shorter than Farah.
  Kara is taller than Alice.
  Leo is older than Ivo.
  Elio is older than Dara.
  Elio is taller than Ivo.
  Hana is shorter than Kara.
  Dara is taller than Hana.
  Farah is taller than Jun.
  Hana is taller than Alice.
  Chen is taller than Bruno.
  Gus is taller than Hana.
  Alice is older than Farah.

  Assume only these statements are true. Counting only what is logically guaranteed, how many people are shorter than Gus? Answer with a number only.

  Keep any reasoning brief. End your response with a final line of the form 'Answer: <answer>'.
evaluation_type: regex
expected_answer: '4'
answer_pattern: (?is)answer:\W*4\W*\Z
