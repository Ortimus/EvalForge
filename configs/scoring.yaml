judge:
  # Ideally a different model family from the models under test, to reduce
  # self-preference bias. Kept on Anthropic for now (only key configured).
  provider: anthropic
  model: claude-sonnet-5-5
  temperature: 0.0          # deterministic judging
  max_tokens: 512

thresholds:
  pass_score: 3.0           # minimum LLM judge score to count as "pass"
  strong_score: 4.5         # threshold for "strong performance" badge
